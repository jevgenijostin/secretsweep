[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsweep"
version = "0.1.0"
description = "Offline, deterministic secret scanning for files and diffs"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
secretsweep = "secretsweep.cli:main"

[tool.setuptools.packages.find]
include = ["secretsweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
