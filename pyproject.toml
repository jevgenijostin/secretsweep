[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsweep"
version = "0.1.0"
description = "Offline, deterministic secret scanning for files and diffs"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
secretsweep = "secretsweep.cli:main"

[tool.setuptools.packages.find]
include = ["secretsweep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
